name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node -e 'const manifest = require("./manifest.json"); if (manifest.version !== process.env.RELEASE_VERSION) throw new Error(`Tag ${process.env.RELEASE_VERSION} does not match manifest ${manifest.version}`)'

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" main.js manifest.json --title "${GITHUB_REF_NAME}" --generate-notes
